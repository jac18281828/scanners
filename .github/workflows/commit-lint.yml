name: commitlint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"

jobs:
  run-commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install -g @commitlint/{cli,config-conventional}

      - name: Resolve commit range and validate
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            FROM="${{ github.event.pull_request.base.sha }}"
            TO="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            TO="$AFTER"
            if [[ "$BEFORE" =~ ^0+$ ]] || [[ "${{ github.event.forced }}" == "true" ]]; then
              FROM="origin/main"
            else
              FROM="$BEFORE"
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            FROM="HEAD~1"
            TO="HEAD"
          else
            echo "unhandled event: ${{ github.event_name }}" >&2
            exit 1
          fi
          echo "range: ${FROM}..${TO}"
          npx commitlint --from "$FROM" --to "$TO" --verbose
